{% extends "base.html" %}
{% block title %}پیام همگانی و برودکست هدفمند{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title"><i class="fas fa-bullhorn text-primary"></i> سامانه ارسال پیام همگانی هدفمند</h1>
        <p class="text-muted mb-0">ارسال اطلاعیه، تخفیف‌ها یا پیام‌های مهم به دسته‌های خاص از کاربران ربات</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-bold">تنظیم پیام ارسالی</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">انتخاب گروه هدف:</label>
                        <select name="target_group" class="form-select" required>
                            <option value="all">👥 همه کاربران عضو ربات</option>
                            <option value="active">✅ کاربران دارای اشتراک فعال</option>
                            <option value="expiring_soon">⏰ کاربرانی که اشتراکشان تا ۳ روز آینده منقضی می‌شود</option>
                            <option value="expired">❌ کاربرانی که اشتراکشان منقضی شده است</option>
                            <option value="test_only">🎁 کاربرانی که فقط تست رایگان گرفته‌اند و خرید نکرده‌اند</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">متن پیام (پشتیبانی از HTML):</label>
                        <textarea name="message" class="form-control" rows="6" placeholder="متن پیام خود را بنویسید..." required></textarea>
                    </div>

                    <div class="row g-2 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">متن دکمه شیشه‌ای (اختیاری):</label>
                            <input type="text" name="btn_text" class="form-control" placeholder="مثال: 🛍 تمدید با تخفیف ویژه">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">لینک دکمه شیشه‌ای (اختیاری):</label>
                            <input type="url" name="btn_url" class="form-control" placeholder="مثال: https://t.me/yourbot?start=renew">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold fs-5" onclick="return confirm('آیا از شروع ارسال همگانی مطمئن هستید؟')">
                        <i class="fas fa-paper-plane me-2"></i> شروع ارسال پیام به گروه هدف
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
