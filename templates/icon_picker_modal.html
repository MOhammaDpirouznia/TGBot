let activeTargetInputId = null;
let activeTargetPreviewId = null;
let currentCategoryFilter = 'all';
let currentSearchQuery = '';
let isResellerPickerMode = false;
let defaultMasterIconForPicker = '';

function openGlobalIconPicker(inputId, previewId, isReseller = false, defaultIcon = '') {
    activeTargetInputId = inputId;
    activeTargetPreviewId = previewId;
    isResellerPickerMode = !!isReseller;
    defaultMasterIconForPicker = defaultIcon || '';
    
    const inputEl = document.getElementById(inputId);
    const currentVal = inputEl ? inputEl.value.trim() : '';
    const badge = document.getElementById('currentSelectedIconBadge');
    if (badge) {
        if (currentVal) {
            badge.textContent = currentVal;
            badge.className = 'badge bg-warning-subtle text-dark border border-warning font-monospace px-2 py-1.5';
        } else {
            badge.textContent = isResellerPickerMode ? (defaultMasterIconForPicker ? `آیکون مدیریت (${defaultMasterIconForPicker})` : 'آیکون مدیریت (هوشمند)') : 'خالی (تشخیص هوشمند)';
            badge.className = 'badge bg-light text-secondary border font-monospace px-2 py-1.5';
        }
    }

    const resetBtn = document.getElementById('iconPickerResetBtn');
    if (resetBtn) {
        if (isResellerPickerMode) {
            resetBtn.innerHTML = '<i class="fas fa-undo me-1"></i> بازگشت به آیکون پیش‌فرض مدیریت';
        } else {
            resetBtn.innerHTML = '<i class="fas fa-wand-magic-sparkles me-1"></i> تنظیم روی تشخیص هوشمند';
        }
    }

    renderIconGrid();
    
    const modalEl = document.getElementById('globalIconPickerModal');
    if (modalEl) {
        let pickerModal = bootstrap.Modal.getInstance(modalEl);
        if (!pickerModal) {
            pickerModal = new bootstrap.Modal(modalEl);
        }
        pickerModal.show();
    }
}

function selectIconFromPicker(iconVal, isEmoji = false) {
    if (activeTargetInputId) {
        const inputEl = document.getElementById(activeTargetInputId);
        if (inputEl) {
            inputEl.value = iconVal;
            inputEl.dispatchEvent(new Event('change'));
        }
    }
    if (activeTargetPreviewId) {
        const prevEl = document.getElementById(activeTargetPreviewId);
        if (prevEl) {
            if (isEmoji || !iconVal.startsWith('fa')) {
                prevEl.className = 'fs-5 text-warning';
                prevEl.textContent = iconVal;
            } else {
                prevEl.textContent = '';
                prevEl.className = iconVal + ' fs-5 text-warning';
            }
        }
    }
    
    // اگر برچسب نشانگر اختصاصی بودن در صفحه نماینده وجود دارد
    if (isResellerPickerMode && activeTargetInputId) {
        const planId = activeTargetInputId.replace('reseller_plan_icon_', '');
        const badgeEl = document.getElementById('custom_icon_badge_' + planId);
        if (badgeEl) {
            badgeEl.classList.remove('d-none');
        }
        const resetBtnEl = document.getElementById('btn_reset_icon_' + planId);
        if (resetBtnEl) {
            resetBtnEl.classList.remove('d-none');
        }
    }
    
    const modalEl = document.getElementById('globalIconPickerModal');
    if (modalEl) {
        const pickerModal = bootstrap.Modal.getInstance(modalEl);
        if (pickerModal) pickerModal.hide();
    }
}

function clearIconInput(inputId, previewId, fallbackIcon = '') {
    const inputEl = document.getElementById(inputId);
    if (inputEl) {
        inputEl.value = '';
        inputEl.dispatchEvent(new Event('change'));
    }
    const prevEl = document.getElementById(previewId);
    if (prevEl) {
        const targetIcon = fallbackIcon || 'fas fa-shield-halved';
        if (targetIcon.startsWith('fa')) {
            prevEl.textContent = '';
            prevEl.className = targetIcon + ' fs-5 text-primary';
        } else {
            prevEl.className = 'fs-5 text-primary';
            prevEl.textContent = targetIcon;
        }
    }
}

function resetToSmartDetectionFromModal() {
    if (activeTargetInputId && activeTargetPreviewId) {
        clearIconInput(activeTargetInputId, activeTargetPreviewId, defaultMasterIconForPicker);
        if (isResellerPickerMode) {
            const planId = activeTargetInputId.replace('reseller_plan_icon_', '');
            const badgeEl = document.getElementById('custom_icon_badge_' + planId);
            if (badgeEl) badgeEl.classList.add('d-none');
            const resetBtnEl = document.getElementById('btn_reset_icon_' + planId);
            if (resetBtnEl) resetBtnEl.classList.add('d-none');
        }
    }
    const modalEl = document.getElementById('globalIconPickerModal');
    if (modalEl) {
        const pickerModal = bootstrap.Modal.getInstance(modalEl);
        if (pickerModal) pickerModal.hide();
    }
}

function liveUpdateIconPreview(inputId, previewId) {
    const inputEl = document.getElementById(inputId);
    const prevEl = document.getElementById(previewId);
    if (!inputEl || !prevEl) return;
    const val = inputEl.value.trim();
    if (!val) {
        prevEl.textContent = '';
        prevEl.className = 'fas fa-shield-halved fs-5 text-primary';
        return;
    }
    if (val.length <= 4 && !val.includes('fa')) {
        prevEl.className = 'fs-5 text-warning';
        prevEl.textContent = val;
    } else {
        prevEl.textContent = '';
        let iconCls = val;
        if (!iconCls.startsWith('fa') && !iconCls.startsWith('bi')) {
            iconCls = 'fas fa-' + iconCls;
        }
        prevEl.className = iconCls + ' fs-5 text-primary';
    }
}

function filterIconCategory(cat, tabEl) {
    currentCategoryFilter = cat;
    document.querySelectorAll('#iconCategoryTabs .nav-link').forEach(btn => btn.classList.remove('active'));
    if (tabEl) tabEl.classList.add('active');
    renderIconGrid();
}

function filterIconCatalog(query) {
    currentSearchQuery = (query || '').toLowerCase().trim();
    renderIconGrid();
}

function clearIconSearch() {
    const sInput = document.getElementById('iconSearchInput');
    if (sInput) sInput.value = '';
    currentSearchQuery = '';
    renderIconGrid();
}

function renderIconGrid() {
    const grid = document.getElementById('iconPickerGrid');
    if (!grid) return;
    
    let filtered = ICON_CATALOG.filter(item => {
        if (currentCategoryFilter !== 'all' && item.cat !== currentCategoryFilter) {
            return false;
        }
        if (currentSearchQuery) {
            const matchName = item.name.toLowerCase().includes(currentSearchQuery);
            const matchEn = (item.en || '').toLowerCase().includes(currentSearchQuery);
            const matchIcon = item.icon.toLowerCase().includes(currentSearchQuery);
            if (!matchName && !matchEn && !matchIcon) return false;
        }
        return true;
    });

    if (filtered.length === 0) {
        grid.innerHTML = `
            <div class="col-12 text-center py-5 text-muted">
                <i class="fas fa-search fs-2 mb-2 d-block opacity-50"></i>
                <div>هیچ آیکونی با این مشخصات یافت نشد.</div>
                <small>می‌توانید نام کلاس فونت‌آوسام یا ایموجی را مستقیماً در فرم وارد نمایید.</small>
            </div>
        `;
        return;
    }

    let html = '';
    filtered.forEach(item => {
        const isEmoji = !!item.isEmoji;
        const iconRender = isEmoji 
            ? `<span style="font-size: 1.55rem; line-height: 1;">${item.icon}</span>` 
            : `<i class="${item.icon}"></i>`;
        
        const valueToPass = item.icon.replace(/'/g, "\\'");
        const badgeBg = item.bg || 'linear-gradient(135deg, #fef3c7 0%, #fde68a 100%)';
        const badgeColor = item.color || '#b45309';
        const badgeBorder = item.border || '#f59e0b';
        
        html += `
            <div class="col">
                <button type="button" class="btn btn-outline-light border text-dark w-100 h-100 p-2 d-flex flex-column align-items-center justify-content-center icon-card-btn shadow-sm rounded-3" 
                        style="transition: all 0.2s ease; min-height: 94px; background-color: #ffffff;" 
                        onclick="selectIconFromPicker('${valueToPass}', ${isEmoji})"
                        title="${item.name} (${item.icon})">
                    <span class="icon-medal-badge d-inline-flex align-items-center justify-content-center rounded-circle shadow-sm mb-1" 
                          style="width: 42px; height: 42px; background: ${badgeBg}; color: ${badgeColor}; border: 1.5px solid ${badgeBorder}; font-size: 1.25rem;">
                        ${iconRender}
                    </span>
                    <span class="small fw-bold text-truncate w-100 text-center mt-1 text-dark" style="font-size: 0.73rem;">${item.name}</span>
                    <span class="badge bg-light text-secondary font-monospace mt-1 px-1 text-truncate w-100 text-center" style="font-size: 0.62rem;">
                        ${isEmoji ? 'ایموجی' : item.icon.replace('fas fa-', '').replace('fab fa-', '')}
                    </span>
                </button>
            </div>
        `;
    });

    grid.innerHTML = html;
}
</script>
