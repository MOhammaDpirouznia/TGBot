name: "Build Protected Linux Binary (Nuitka)"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'نسخه مورد نظر برای تگ و نام‌گذاری پکیج (مثلاً v3.28.0)'
        required: false
        default: 'v3.28'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-protected-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 دریافت سورس‌کد (Checkout)
        uses: actions/checkout@v4

      - name: 🐍 راه‌اندازی پایتون نسخه ۳.۱۱
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: ⚙️ نصب ابزارهای کامپایل C/C++ و Nuitka
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential patchelf ccache
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka zstandard

      - name: 🔒 اجرای اسکریپت کامپایل باینری Nuitka
        run: |
          python build_nuitka.py

      - name: 📤 آپلود پکیج به عنوان Artifact در گیت‌هاب
        uses: actions/upload-artifact@v4
        with:
          name: TGBot_Protected_Linux_x86_64
          path: dist/TGBot_Protected_Release.zip
          retention-days: 14

      - name: 🏷️ اتصال پکیج به ریلیز رسمی گیت‌هاب (در صورت وجود تگ)
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          echo "Attaching protected binary to release $TAG_NAME..."
          gh release upload "$TAG_NAME" dist/TGBot_Protected_Release.zip --clobber || echo "No existing release with tag, artifact is saved."
