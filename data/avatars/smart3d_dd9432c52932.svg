<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
    <defs>
        <linearGradient id="bg_grad_royal_3154" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e1b4b" />
            <stop offset="60%" stop-color="#4338ca" />
            <stop offset="100%" stop-color="#6366f1" />
        </linearGradient>
        <radialGradient id="specular_3154" cx="35%" cy="30%" r="60%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
        </radialGradient>
        <filter id="glow_3154" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <linearGradient id="metal_grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f8fafc" />
            <stop offset="50%" stop-color="#cbd5e1" />
            <stop offset="100%" stop-color="#64748b" />
        </linearGradient>
    </defs>
    
    <!-- پس‌زمینه دایره‌ای با سایه ملایم -->
    <circle cx="60" cy="60" r="58" fill="url(#bg_grad_royal_3154)" />
    <circle cx="60" cy="60" r="58" fill="url(#specular_3154)" />
    
    <!-- حلقه حاشیه مدرن نئونی -->
    <circle cx="60" cy="60" r="56" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />

